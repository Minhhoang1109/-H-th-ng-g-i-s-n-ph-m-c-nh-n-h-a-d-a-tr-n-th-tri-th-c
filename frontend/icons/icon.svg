<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064d2"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)"/>

  <!-- Knowledge Graph Nodes & Edges -->
  <line x1="130" y1="150" x2="256" y2="240" stroke="#93c5fd" stroke-width="6" stroke-opacity="0.6"/>
  <line x1="382" y1="160" x2="256" y2="240" stroke="#93c5fd" stroke-width="6" stroke-opacity="0.6"/>
  <line x1="140" y1="360" x2="256" y2="270" stroke="#93c5fd" stroke-width="6" stroke-opacity="0.6"/>
  <line x1="372" y1="360" x2="256" y2="270" stroke="#93c5fd" stroke-width="6" stroke-opacity="0.6"/>

  <circle cx="130" cy="150" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="382" cy="160" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="140" cy="360" r="16" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="372" cy="360" r="16" fill="#ec4899" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>

  <!-- Center Badge -->
  <rect x="106" y="166" width="300" height="170" rx="32" fill="#0f172a" stroke="#f5af02" stroke-width="8"/>

  <!-- Logo K / H -->
  <text x="145" y="275" font-family="Inter, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#e53238">K</text>
  <text x="235" y="270" font-family="Inter, -apple-system, sans-serif" font-size="95" font-weight="800" fill="#94a3b8">/</text>
  <text x="285" y="275" font-family="Inter, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#38bdf8">H</text>

  <!-- STORE Label -->
  <text x="256" y="390" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f5af02" letter-spacing="3">STORE • KG</text>
</svg>